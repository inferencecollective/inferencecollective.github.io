<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGradHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <g transform="translate(8, 6)" filter="url(#favGlow)">
    <!-- Hexagonal Frame -->
    <polygon points="24,2 44,13.5 44,36.5 24,48 4,36.5 4,13.5" fill="#071914" stroke="url(#favGradHex)" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Internal Mesh -->
    <line x1="24" y1="2" x2="24" y2="48" stroke="#34d399" stroke-width="1" opacity="0.4"/>
    <line x1="4" y1="13.5" x2="44" y2="36.5" stroke="#34d399" stroke-width="1" opacity="0.35"/>
    <line x1="4" y1="36.5" x2="44" y2="13.5" stroke="#34d399" stroke-width="1" opacity="0.35"/>

    <!-- Forward Inference Glyphs -->
    <path d="M17 16 L25 25 L17 34" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M27 16 L35 25 L27 34" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Nodes at Vertices -->
    <circle cx="24" cy="2" r="2.5" fill="#38bdf8"/>
    <circle cx="44" cy="13.5" r="2.5" fill="#34d399"/>
    <circle cx="44" cy="36.5" r="2.5" fill="#38bdf8"/>
    <circle cx="24" cy="48" r="2.5" fill="#34d399"/>
    <circle cx="4" cy="36.5" r="2.5" fill="#38bdf8"/>
    <circle cx="4" cy="13.5" r="2.5" fill="#34d399"/>
  </g>
</svg>
