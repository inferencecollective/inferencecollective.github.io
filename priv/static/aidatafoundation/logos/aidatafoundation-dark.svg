<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none">
  <defs>
    <linearGradient id="icGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="icWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="icGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- High-Precision Neural Hexagon Inference Core -->
  <g transform="translate(2, 4)" filter="url(#icGlow)">
    <!-- Outer Hexagonal Frame -->
    <polygon points="20,1 36,10.25 36,28.75 20,38 4,28.75 4,10.25" fill="#071914" stroke="url(#icGradCyan)" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Inner Synaptic Flow Lines (Collective Mesh) -->
    <line x1="20" y1="1" x2="20" y2="38" stroke="#34d399" stroke-width="0.8" opacity="0.4"/>
    <line x1="4" y1="10.25" x2="36" y2="28.75" stroke="#34d399" stroke-width="0.8" opacity="0.3"/>
    <line x1="4" y1="28.75" x2="36" y2="10.25" stroke="#34d399" stroke-width="0.8" opacity="0.3"/>

    <!-- Forward Inference Rays / Fast Forward Symbol -->
    <path d="M15 13 L21 19.5 L15 26" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M22 13 L28 19.5 L22 26" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Collective Nodes at Vertices -->
    <circle cx="20" cy="1" r="1.8" fill="#38bdf8"/>
    <circle cx="36" cy="10.25" r="1.8" fill="#34d399"/>
    <circle cx="36" cy="28.75" r="1.8" fill="#38bdf8"/>
    <circle cx="20" cy="38" r="1.8" fill="#34d399"/>
    <circle cx="4" cy="28.75" r="1.8" fill="#38bdf8"/>
    <circle cx="4" cy="10.25" r="1.8" fill="#34d399"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(46, 0)">
    <text x="0" y="26" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="19px" letter-spacing="-0.02em">INFERENCE</text>
    <text x="1" y="39" fill="url(#icWordGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9px" letter-spacing="0.28em">COLLECTIVE</text>
  </g>
</svg>
